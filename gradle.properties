version=0.1.0-SNAPSHOT

# Parity work keeps execution ordering explicit until the complete evidence suite proves optimizations safe.
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.caching=false

# Developer builds provision the pinned Temurin Java 25 toolchain when no matching installation exists.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
