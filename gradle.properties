version=0.1.0-SNAPSHOT

# Parity work keeps execution ordering explicit until the complete evidence suite proves optimizations safe.
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.caching=false

# Builds must use an installed Java 25 JDK; automatic provisioning would make toolchain identity implicit.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
