name: Set up qualified Temurin JDK
description: Download, verify, and install the exact platform-specific Temurin qualification archive.

inputs:
  platform:
    description: Qualified archive platform identity.
    required: true

runs:
  using: composite
  steps:
    - name: Download and verify the pinned Temurin archive
      shell: pwsh
      run: >-
        & '${{ github.workspace }}/build/provision-qualified-jdk.ps1'
        -Platform '${{ inputs.platform }}'
        -OutputDirectory '${{ runner.temp }}'
        -GitHubEnvironmentFile $env:GITHUB_ENV

    - name: Install the verified Java 25 build
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        architecture: x64
        cache: gradle
        cache-dependency-path: |
          **/*.gradle.kts
          **/gradle.lockfile
          **/settings-gradle.lockfile
          gradle/libs.versions.toml
          gradle/verification-metadata.xml
          build-logic/gradle/verification-metadata.xml
          gradle/wrapper/gradle-wrapper.properties
        distribution: jdkfile
        jdk-file: ${{ env.JBSA_JDK_ARCHIVE }}
        # setup-java requires a SemVer label; the verified archive fixes the exact 25.0.4.1+1 build.
        java-version: '25.0.4'
