version = 1

[[annotations]]
path = [
  ".claude/**",
  ".codex/**",
  ".github/**",
  ".idea/**",
  ".mvn/**",
  ".gitattributes",
  ".gitignore",
  ".gitmodules",
  ".graphifyignore",
  "AGENTS.md",
  "AGENTS.md.graphify",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "CONTEXT.md",
  "NOTICE",
  "README.md",
  "RELEASE-NOTES.md",
  "REUSE.toml",
  "THIRD-PARTY-NOTICES.md",
  "build/**",
  "compliance/**",
  "docs/**",
  "jbsa*/**",
  "pom.xml",
  "tests/fixtures/local/.gitkeep",
  "tests/fixtures/local/README.md"
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2026 evildarkarchon"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["mvnw", "mvnw.cmd"]
